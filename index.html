<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Diego Data Sources</title>
<style>
:root{--stone:#2C3347;--lav:#3A6AAE;--dteal:#0077A3;--teal:#0381A2;--brand:#06B7DF;--light:#84D9F7;--coral:#D95B32}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--stone);background:#F4F8FB}
header{background:linear-gradient(135deg,var(--stone),var(--lav) 60%,var(--dteal));color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:18px}
header h1{margin:0 0 4px;font-size:22px}
header p{margin:0 0 14px;color:var(--light);font-size:14px}
#q{width:100%;max-width:520px;padding:12px 16px;font-size:16px;border:2px solid transparent;border-radius:999px;outline:none;color:var(--stone)}
#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(132,217,247,.5)}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{border:1px solid var(--lav);background:#fff;color:var(--lav);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip:hover{background:var(--light)}
.chip.active{background:var(--lav);color:#fff}
#count{font-size:13px;margin:6px 2px 12px;color:var(--teal)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;border-top:4px solid var(--brand);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(44,51,71,.08);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(44,51,71,.16)}
.badge{align-self:flex-start;background:var(--stone);color:#fff;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.card h3{margin:0;font-size:16px;line-height:1.3;color:var(--stone)}
.card p{margin:0;font-size:13.5px;line-height:1.45;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.meta span{background:#E6F6FC;color:var(--dteal);padding:3px 8px;border-radius:6px}
.card a.btn{align-self:flex-start;background:var(--dteal);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600}
.card a.btn:hover,.card a.btn:focus{background:var(--coral)}
mark{background:var(--light);color:var(--stone);border-radius:3px;padding:0 1px}
#empty{display:none;padding:30px;text-align:center;color:var(--coral);font-weight:600}
</style>
</head>
<body>

  <h1>San Diego Data Sources</h1>

let activeType="All";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl=(s,t)=>{s=esc(s);if(!t)return s;
  const safe=esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return s.replace(new RegExp("("+safe+")","gi"),"<mark>$1</mark>");};
const types=["All",...[...new Set(sources.map(s=>s.type))].sort()];

chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;

function render(){
