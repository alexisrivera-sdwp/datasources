<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Segoe UI,Arial,sans-serif;margin:12px;background:#fff}
  #q{width:100%;max-width:420px;padding:10px;font-size:16px;border:1px solid #888;border-radius:6px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
  .card{border:1px solid #ddd;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h3{margin:0 0 6px;font-size:16px}
  .card a{color:#0f6cbd;word-break:break-all}
  #count{margin-top:8px;color:#555;font-size:13px}
</style>
</head>
<body>
<input id="q" type="search" placeholder="Search sources..." aria-label="Search sources">
<div id="count"></div>
<div id="grid"></div>
<script>
const sources = [
  {name:"Bureau of Labor Statistics", desc:"Employment and wage data", url:"https://www.bls.gov"},
  {name:"California EDD LMID", desc:"State labor-market information", url:"https://labormarketinfo.edd.ca.gov"},
  {name:"O*NET OnLine", desc:"Occupational information", url:"https://www.onetonline.org"}
];
const grid=document.getElementById("grid"), q=document.getElementById("q"), count=document.getElementById("count");
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
  const t=q.value.trim().toLowerCase();
  const hits=sources.filter(s=>(s.name+" "+s.desc+" "+s.url).toLowerCase().includes(t));
  grid.innerHTML=hits.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p>
    <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>`).join("");
  count.textContent=hits.length+" of "+sources.length+" shown";
}
q.addEventListener("input",render); render();
</script>
</body>
</html>
